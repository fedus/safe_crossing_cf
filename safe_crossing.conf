<VirtualHost *:80>
    ServerName your-domain.com
    ServerAdmin webmaster@your-domain.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5001/
    ProxyPassReverse / http://127.0.0.1:5001/

    ErrorLog ${APACHE_LOG_DIR}/safe_crossing_error.log
    CustomLog ${APACHE_LOG_DIR}/safe_crossing_access.log combined

    <Directory /path/to/safe_crossing_cf>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

# Optional HTTPS configuration (recommended)
<VirtualHost *:443>
    ServerName your-domain.com
    ServerAdmin webmaster@your-domain.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5001/
    ProxyPassReverse / http://127.0.0.1:5001/

    ErrorLog ${APACHE_LOG_DIR}/safe_crossing_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/safe_crossing_ssl_access.log combined

    SSLEngine on
    SSLCertificateFile /path/to/certificate.crt
    SSLCertificateKeyFile /path/to/private.key
    # SSLCertificateChainFile /path/to/chain.crt

    <Directory /path/to/safe_crossing_cf>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost> 